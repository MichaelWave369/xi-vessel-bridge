name: Xi-Phi Commons GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "roadmap/**"
      - "reference/python/xi_capability_r171.py"
      - "reference/python/xi_pilot_r18.py"
      - "reference/python/xi_shared_roadmap_r17.py"
      - "scripts/build_commons_gateway.py"
      - "scripts/verify_commons_deployment.py"
      - "tests/test_commons_gateway_r173.py"
      - "tests/test_commons_deployment_r175.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phi-xi-commons-pages
  cancel-in-progress: false

jobs:
  detect-pages:
    # User authorizes publishing by enabling GitHub Actions as repository Pages source.
    # No secrets, PAT, or separate repository variable are needed.
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.inspect.outputs.configured }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Inspect GitHub Pages publishing source
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --location --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/xi-pages-config.json -w "%{http_code}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" = "200" ]; then
            kind=$(python -c "import json; print(json.load(open('/tmp/xi-pages-config.json')).get('build_type','unknown'))")
            if [ "$kind" = "workflow" ]; then
              echo "configured=true" >> "$GITHUB_OUTPUT"
              echo "Pages source is GitHub Actions; verified build can deploy." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "configured=false" >> "$GITHUB_OUTPUT"
              echo "Pages configured for '$kind', not GitHub Actions. Switch Settings > Pages > Source." >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "$code" = "404" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Pages is not configured. Enable GitHub Actions under Settings > Pages > Source." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pages setup probe could not be verified (HTTP $code)." >&2
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify static gateway and adversarial public-deploy fixtures
        run: |
          python -m unittest discover -s tests -p 'test_commons_gateway_r173.py' -v
          python -m unittest discover -s tests -p 'test_commons_deployment_r175.py' -v
          python scripts/build_commons_gateway.py --out dist
      - name: Prepare static Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Deploys automatically on the next main push or manual dispatch once the
    # owner has enabled Pages -> Source: GitHub Actions.
    if: needs.detect-pages.outputs.configured == 'true'
    needs: [detect-pages, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure already-enabled GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy public-only Commons site
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source pinned to deployed revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate expected public packet manifest
        run: python scripts/build_commons_gateway.py --out dist
      - name: Independently read verified public HTTPS site
        shell: bash
        run: |
          set -euo pipefail
          manifest_sha=$(sha256sum dist/handoff/manifest.json | awk '{print $1}')
          python scripts/verify_commons_deployment.py \
            --expected-manifest "$manifest_sha" \
            --attempts 12 --delay 10 > pages-availability-evidence.json
          cat pages-availability-evidence.json
          echo "Public static site verified. Xi real crossing remains NOT RUN." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload redacted public deployment availability evidence
        uses: actions/upload-artifact@v4
        with:
          name: phi-xi-r17-5-pages-availability-evidence
          path: pages-availability-evidence.json
          if-no-files-found: error
          retention-days: 30
