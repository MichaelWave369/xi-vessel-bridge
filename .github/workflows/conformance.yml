name: Xi Bridge Conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install R3 offline crypto test dependency
        run: python -m pip install -r requirements-r3.txt

      - name: R18.8 cold third-party bundle intake invariants (synthetic tests only)
        run: |
          python -m py_compile scripts/xi_cold_intake_r188.py
          python -m unittest discover -s tests -p 'test_xi_cold_intake_r188.py' -v
          # Deliberately DO NOT check in or run received Xi source ZIPs.
      - name: Run reciprocal R3 sealed fixture
        run: python reference/python/demo_peer_r3.py
      - name: Run two-process R4 fixture
        run: python reference/python/demo_peer_r4.py
      - name: Run R5 peer-grant and revocation lifecycle
        run: python reference/python/demo_peer_r5.py
      - name: Run R6 durable revocation and rollback demo
        run: python reference/python/demo_peer_r6.py
      - name: Export public-only R7 witness
        run: python reference/python/xi_peer_r7_handoff.py export --out r7-output/public-handoff.json
      - name: Independently verify exported R7 witness
        run: python reference/python/xi_peer_r7_handoff.py verify --file r7-output/public-handoff.json
      - name: Upload public-only R7 witness artifact
        uses: actions/upload-artifact@v4
        with:
          name: xi-r7-public-witness
          path: r7-output/public-handoff.json
          if-no-files-found: error
          retention-days: 7
      - name: Export and independently decrypt R8 public-only synthetic witness
        run: |
          python reference/python/xi_peer_r8_disclosed.py export --out r7-output/r8-public-disclosed-fixture.json
          python reference/python/xi_peer_r8_disclosed.py verify --file r7-output/r8-public-disclosed-fixture.json
      - name: Upload R8 disclosed synthetic test witness
        uses: actions/upload-artifact@v4
        with:
          name: xi-r8-public-disclosed-witness
          path: r7-output/r8-public-disclosed-fixture.json
          if-no-files-found: error
          retention-days: 7
      - name: Issue and verify R9 external-pin challenge fixture
        run: |
          python reference/python/xi_peer_r9_challenge.py challenge --out r7-output/r9/challenge.json
          python reference/python/xi_peer_r9_challenge.py respond --challenge r7-output/r9/challenge.json --out r7-output/r9/response.json --pins-out r7-output/r9/self-issued-demo-pins.json
          python reference/python/xi_peer_r9_challenge.py verify --challenge r7-output/r9/challenge.json --response r7-output/r9/response.json --pins r7-output/r9/self-issued-demo-pins.json --ledger .xi-peer-state/r9-ci-verified.sqlite3
      - name: Upload R9 synthetic challenged witness artifact
        uses: actions/upload-artifact@v4
        with:
          name: xi-r9-self-issued-challenge-fixture
          path: r7-output/r9/*.json
          if-no-files-found: error
          retention-days: 7
      - name: R10 unresolved partner contract stays blocked
        run: |
          python reference/python/xi_partner_r10.py template --out r10-output/hunter-unfilled-candidate.json
          python reference/python/xi_partner_r10.py inspect --file r10-output/hunter-unfilled-candidate.json
          if python reference/python/xi_partner_r10.py inspect --file r10-output/hunter-unfilled-candidate.json --require-complete; then
            echo 'FAIL: incomplete partner contract was incorrectly accepted'
            exit 1
          fi
      - name: R10 synthetic contract passes shape-only review
        run: |
          python reference/python/xi_partner_r10.py synthetic --out r10-output/synthetic-candidate.json
          python reference/python/xi_partner_r10.py inspect --file r10-output/synthetic-candidate.json --require-complete
      - name: Publish R10 UNFILLED request and synthetic fixture
        uses: actions/upload-artifact@v4
        with:
          name: xi-r10-partner-contract-intake
          path: r10-output/*.json
          if-no-files-found: error
          retention-days: 7
      - name: R11 two separate review signatures bind exact R10 contract
        run: |
          python reference/python/xi_partner_r11.py fixture --dir r11-output/demo
          python reference/python/xi_partner_r11.py verify --contract r11-output/demo/contract.json --request r11-output/demo/request.json --xi-attestation r11-output/demo/xi-attestation.json --phi-attestation r11-output/demo/phi-attestation.json --pins r11-output/demo/self-issued-demo-pins.json --ledger .xi-peer-state/r11-ci-review.sqlite3
          if python reference/python/xi_partner_r11.py verify --contract r11-output/demo/contract.json --request r11-output/demo/request.json --xi-attestation r11-output/demo/xi-attestation.json --phi-attestation r11-output/demo/phi-attestation.json --pins r11-output/demo/self-issued-demo-pins.json --ledger .xi-peer-state/r11-ci-review.sqlite3; then
            echo "FAIL: R11 allowed review replay"
            exit 1
          fi
      - name: Upload public R11 self-issued REVIEW-ONLY evidence
        uses: actions/upload-artifact@v4
        with:
          name: xi-r11-dual-review-synthetic-only
          path: r11-output/demo/*.json
          if-no-files-found: error
          retention-days: 7
      - name: R12 unverified partner answer remains pending
        run: |
          python reference/python/xi_partner_r12.py generate --dir r12-output/interop
          python reference/python/xi_partner_r12.py assess --suite r12-output/interop/suite.json --response r12-output/interop/response-template.json
          if python reference/python/xi_partner_r12.py assess --suite r12-output/interop/suite.json --response r12-output/interop/response-template.json --require-all-matches; then
            echo "FAIL: an unfilled partner questionnaire was marked conformant"
            exit 1
          fi
      - name: R12 synthetic example matches immutable test vectors, still untrusted
        run: python reference/python/xi_partner_r12.py assess --suite r12-output/interop/suite.json --response r12-output/interop/synthetic-example-response.json --require-all-matches
      - name: Upload R12 neutral partner conformance questionnaire
        uses: actions/upload-artifact@v4
        with:
          name: xi-r12-neutral-partner-conformance
          path: r12-output/interop/*.json
          if-no-files-found: error
          retention-days: 14
      - name: R13 reject untrusted partner bundle tampering and live claims
        run: python -m unittest discover -s tests -p "test_xi_partner_r13_intake.py" -v
      - name: R14 independently verify public-byte evidence and block false peer authority
        run: python -m unittest discover -s tests -p "test_xi_partner_r14_evidence.py" -v
      - name: Run reference handshake
        run: python reference/python/bridge_demo.py
      - name: Run conformance tests
        run: python -m unittest discover -s tests -v

      - name: R17.1 inspect non-authorizing Xi capability registry
        run: |
          python reference/python/xi_capability_r171.py inspect
          if python reference/python/xi_capability_r171.py require-live; then
            echo "FAIL: static registry was allowed to certify live Xi connection"
            exit 1
          fi
      - name: R18 generate and independently check synthetic partner handoff
        run: |
          mkdir -p partner-handoff-output
          python reference/python/xi_capability_r171.py request > partner-handoff-output/request.json
          python reference/python/xi_pilot_r18.py fixture > partner-handoff-output/synthetic-fixture.json
          python reference/python/xi_pilot_r18.py verify-fixture --file partner-handoff-output/synthetic-fixture.json
          python reference/python/xi_pilot_r18.py draft > partner-handoff-output/pilot-preflight-draft.json
          python reference/python/xi_pilot_r18.py preflight --file partner-handoff-output/pilot-preflight-draft.json
          python reference/python/xi_pilot_r18.py transcript-template > partner-handoff-output/transcript-template.json
          if python reference/python/xi_pilot_r18.py require-live; then
            echo "FAIL: synthetic packet was allowed to certify remote connection"
            exit 1
          fi
      - name: Publish public-only R17.1 + R18 PHI partner handoff
        uses: actions/upload-artifact@v4
        with:
          name: phi-xi-r17-1-r18-public-handoff
          path: partner-handoff-output/*.json
          if-no-files-found: error
          retention-days: 14

      - name: R17.2 validate local Python partner intake (including negative controls)
        run: |
          python reference/python/xi_partner_r172_workbench.py
          if python reference/python/xi_partner_r172_workbench.py --require-live; then
            echo "FAIL: self-reported intake was promoted to live authority"
            exit 1
          fi
      - name: Set up Node for browser validator parity
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check R17.2 browser workbench syntax and adversarial test suite
        run: |
          node --check roadmap/intake-core.js
          node --check roadmap/intake.js
          node --test tests/test_intake_core.cjs

      - name: Prove Python and browser canonical registry SHA-256 parity
        run: |
          PY_HASH=$(python reference/python/xi_capability_r171.py inspect | python -c "import json,sys; print(json.load(sys.stdin)['registry_sha256'])")
          JS_HASH=$(node -e 'const fs=require("node:fs"); const c=require("./roadmap/intake-core.js"); const crypto=require("node:crypto"); const o=JSON.parse(fs.readFileSync("roadmap/capability-registry.json","utf8")); console.log(crypto.createHash("sha256").update(c.canonical(o),"utf8").digest("hex"));')
          test "$PY_HASH" = "$JS_HASH"

      - name: R17.3 static gateway, offline worker and public packet build
        run: |
          python scripts/build_commons_gateway.py --out dist
          python -m unittest discover -s tests -p "test_commons_gateway_r173.py" -v
          node --check roadmap/commons.js
          node --check roadmap/sw.template.js
      - name: Upload R17.3 full public gateway preview
        uses: actions/upload-artifact@v4
        with:
          name: phi-xi-r17-3-public-gateway-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: R18.1 two-house signed synthetic process simulation and fail-closed evidence
        run: |
          mkdir -p simulation-output
          python reference/python/xi_two_house_r181.py demo > simulation-output/r181-public-simulation.json
          python -c "import json; p=json.load(open('simulation-output/r181-public-simulation.json')); assert p['status']=='R18_1_TWO_HOUSE_LOCAL_SIMULATION_PASS' and p['process_count']==2 and p['physical_hosts']==1 and p['live_xi_connected'] is False and p['r18_real_two_host_pilot']=='NOT_RUN'"
          python -m unittest discover -s tests -p "test_xi_two_house_r181.py" -v
          if python reference/python/xi_two_house_r181.py require-live; then
            echo "FAIL: local simulation was incorrectly promoted to Xi live authority"
            exit 1
          fi
      - name: Upload redacted R18.1 local-only simulation witness
        uses: actions/upload-artifact@v4
        with:
          name: phi-xi-r18-1-two-house-local-simulation
          path: simulation-output/r181-public-simulation.json
          if-no-files-found: error
          retention-days: 14

      - name: R18.2 local-only console shape, redaction and browser security negative controls
        run: |
          node --check roadmap/lab-core.js
          node --check roadmap/lab.js
          node --test tests/test_lab_core_r182.cjs
          python -m unittest discover -s tests -p "test_lab_console_r182.py" -v
          python -m unittest discover -s tests -p "test_commons_deployment_r175.py" -v
      - name: R18.3 browser-only failure injection state machine and offline bundle
        run: |
          node --check roadmap/fault-core.js
          node --check roadmap/fault.js
          node --test tests/test_fault_core_r183.cjs
          python -m unittest discover -s tests -p 'test_fault_bundle_r183.py' -v
          python -m unittest discover -s tests -p 'test_commons_deployment_r175.py' -v

      - name: R18.4 run actual two-process Ed25519 fault gauntlet (local only)
        run: |
          mkdir -p fault-evidence
          python reference/python/xi_fault_gauntlet_r184.py demo > fault-evidence/r184-local-worker-report.json
          python -c "import json; r=json.load(open('fault-evidence/r184-local-worker-report.json')); assert r['status']=='LOCAL_R18_4_GAUNTLET_PASS' and r['case_count']==14 and r['passed_count']==14 and r['physical_hosts']==1 and r['independent_xi_receipts']==0 and r['live_xi_connected'] is False and r['authority']=='none'"
          python -m unittest discover -s tests -p 'test_xi_fault_gauntlet_r184.py' -v
          node --check roadmap/fault-core.js
          node --check roadmap/fault.js
          node --test tests/test_fault_worker_r184.cjs
          node -e 'const fs=require("fs");const c=require("./roadmap/fault-core.js");const x=JSON.parse(fs.readFileSync("fault-evidence/r184-local-worker-report.json","utf8"));const o=c.validateWorkerReport(x);if(o.case_count!==14 || o.external_gates_promoted!==0)process.exit(1);'
          if python reference/python/xi_fault_gauntlet_r184.py require-live; then
            echo "FAIL: R18.4 local worker fixtures promoted to live Xi authority"
            exit 1
          fi
      - name: Upload R18.4 redacted real-local-worker fault witness
        uses: actions/upload-artifact@v4
        with:
          name: phi-xi-r18-4-real-local-worker-fault-gauntlet
          path: fault-evidence/r184-local-worker-report.json
          if-no-files-found: error
          retention-days: 21
      - name: R18.5 session re-entry copy packet and public-only offline source
        run: |
          node --check roadmap/room.js
          node --test tests/test_room_briefing_r185.cjs
          python -m unittest discover -s tests -p 'test_room_briefing_r185.py' -v
          python -m unittest discover -s tests -p 'test_commons_deployment_r175.py' -v
      - name: R18.6 source-bound bilateral gate agenda and offline board guards
        run: |
          node --check roadmap/gates-core.js
          node --check roadmap/gates.js
          node --test tests/test_gate_board_r186.cjs
          python -m unittest discover -s tests -p 'test_gate_board_r186.py' -v
          python -m unittest discover -s tests -p 'test_commons_deployment_r175.py' -v
      - name: R18.7 strict unapproved synthetic pilot charter and original R18 source parity
        run: |
          node --check roadmap/charter-core.js
          node --check roadmap/charter.js
          node --test tests/test_charter_core_r187.cjs
          python -m unittest discover -s tests -p 'test_charter_bundle_r187.py' -v
          python -m unittest discover -s tests -p 'test_commons_deployment_r175.py' -v
