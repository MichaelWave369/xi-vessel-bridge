name: Xi Bridge Conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install R3 offline crypto test dependency
        run: python -m pip install -r requirements-r3.txt
      - name: Run reciprocal R3 sealed fixture
        run: python reference/python/demo_peer_r3.py
      - name: Run two-process R4 fixture
        run: python reference/python/demo_peer_r4.py
      - name: Run R5 peer-grant and revocation lifecycle
        run: python reference/python/demo_peer_r5.py
      - name: Run R6 durable revocation and rollback demo
        run: python reference/python/demo_peer_r6.py
      - name: Run reference handshake
        run: python reference/python/bridge_demo.py
      - name: Run conformance tests
        run: python -m unittest discover -s tests -v
