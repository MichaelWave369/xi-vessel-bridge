name: Xi Bridge Conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install R3 offline crypto test dependency
        run: python -m pip install -r requirements-r3.txt
      - name: Run reciprocal R3 sealed fixture
        run: python reference/python/demo_peer_r3.py
      - name: Run two-process R4 fixture
        run: python reference/python/demo_peer_r4.py
      - name: Run R5 peer-grant and revocation lifecycle
        run: python reference/python/demo_peer_r5.py
      - name: Run R6 durable revocation and rollback demo
        run: python reference/python/demo_peer_r6.py
      - name: Export public-only R7 witness
        run: python reference/python/xi_peer_r7_handoff.py export --out r7-output/public-handoff.json
      - name: Independently verify exported R7 witness
        run: python reference/python/xi_peer_r7_handoff.py verify --file r7-output/public-handoff.json
      - name: Upload public-only R7 witness artifact
        uses: actions/upload-artifact@v4
        with:
          name: xi-r7-public-witness
          path: r7-output/public-handoff.json
          if-no-files-found: error
          retention-days: 7
      - name: Export and independently decrypt R8 public-only synthetic witness
        run: |
          python reference/python/xi_peer_r8_disclosed.py export --out r7-output/r8-public-disclosed-fixture.json
          python reference/python/xi_peer_r8_disclosed.py verify --file r7-output/r8-public-disclosed-fixture.json
      - name: Upload R8 disclosed synthetic test witness
        uses: actions/upload-artifact@v4
        with:
          name: xi-r8-public-disclosed-witness
          path: r7-output/r8-public-disclosed-fixture.json
          if-no-files-found: error
          retention-days: 7
      - name: Issue and verify R9 external-pin challenge fixture
        run: |
          python reference/python/xi_peer_r9_challenge.py challenge --out r7-output/r9/challenge.json
          python reference/python/xi_peer_r9_challenge.py respond --challenge r7-output/r9/challenge.json --out r7-output/r9/response.json --pins-out r7-output/r9/self-issued-demo-pins.json
          python reference/python/xi_peer_r9_challenge.py verify --challenge r7-output/r9/challenge.json --response r7-output/r9/response.json --pins r7-output/r9/self-issued-demo-pins.json --ledger .xi-peer-state/r9-ci-verified.sqlite3
      - name: Upload R9 synthetic challenged witness artifact
        uses: actions/upload-artifact@v4
        with:
          name: xi-r9-self-issued-challenge-fixture
          path: r7-output/r9/*.json
          if-no-files-found: error
          retention-days: 7
      - name: R10 unresolved partner contract stays blocked
        run: |
          python reference/python/xi_partner_r10.py template --out r10-output/hunter-unfilled-candidate.json
          python reference/python/xi_partner_r10.py inspect --file r10-output/hunter-unfilled-candidate.json
          if python reference/python/xi_partner_r10.py inspect --file r10-output/hunter-unfilled-candidate.json --require-complete; then
            echo 'FAIL: incomplete partner contract was incorrectly accepted'
            exit 1
          fi
      - name: R10 synthetic contract passes shape-only review
        run: |
          python reference/python/xi_partner_r10.py synthetic --out r10-output/synthetic-candidate.json
          python reference/python/xi_partner_r10.py inspect --file r10-output/synthetic-candidate.json --require-complete
      - name: Publish R10 UNFILLED request and synthetic fixture
        uses: actions/upload-artifact@v4
        with:
          name: xi-r10-partner-contract-intake
          path: r10-output/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Run reference handshake
        run: python reference/python/bridge_demo.py
      - name: Run conformance tests
        run: python -m unittest discover -s tests -v
